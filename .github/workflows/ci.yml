name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: |
          pnpm test:common
          pnpm test:api
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -f docker/Dockerfile -t kambriq-api:${{ github.sha }} .

      - name: Check the image contains the app
        run: |
          docker image ls kambriq-api
          docker run --rm --entrypoint node kambriq-api:${{ github.sha }} \
            -e "require('fs').accessSync('dist/apps/api/main.js'); console.log('main.js is in the image')"