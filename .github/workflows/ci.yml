name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "hello from Github Actions"

      - name: Look at the runner
        run: |
          whoami
          pwd
          ls -la
      - name: Get code
        uses: actions/checkout@v7

      - name: Look again
        run: ls -la
