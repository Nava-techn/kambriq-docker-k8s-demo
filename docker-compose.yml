name: kambriq
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kambriq_apik
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      -  DATABASE_URL_CORE=postgresql://postgres:password@db:5432/kambriq_core
      -  DATABASE_URL_KBS=postgresql://postgres:password@db:5432/kambriq_kbs
      -  DATABASE_URL_KAMNET=postgresql://postgres:password@db:5432/kambriq_kamnet
      -  DATABASE_URL_LANDS=postgresql://postgres:password@db:5432/kambriq_lands
      -  JWT_SECRET=dev-secret-minimum-32-characters-long-change-in-prod!!
      -  STORAGE_TRANSPORT=disabled
      -  REDIS_HOST=redis
      -  REDIS_PORT=6379
      -  PAYMENT_CHANNELS_TRANSPORT=disabled
  db:
    image: postgres:15.3
    container_name: kambriq_dbk
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kambriq_db
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    image: redis:7.2.0
    container_name: kambriq_redisk
    ports:
      - "6379:6379"
